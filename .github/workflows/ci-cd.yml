name: Auth App CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Typechecks and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: npm run test:int

      - name: Verify Production Build
        run: npm run build

  deploy:
    name: Deploy to Proxmox LXC (PM2)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Pull, Build, Restart PM2, and Assert Health
        run: |
          cd /opt/auth-app
          git fetch origin main
          git reset --hard origin/main
          npm ci
          npm run build
          pm2 restart auth-microservice || pm2 start dist/index.js --name auth-microservice
          sleep 2
          curl -f http://127.0.0.1:3000/healthz || exit 1
