name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Proxmox LXC
    runs-on: self-hosted
    steps:
      - name: Pull, Build, and Restart PM2
        run: |
          cd /opt/auth-app
          git fetch origin main
          git reset --hard origin/main
          npm ci
          npm run build
          pm2 restart auth-microservice
